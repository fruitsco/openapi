    CartErrorGeneric:
      title: CartErrorGeneric
      description: A cart error that carries nothing but its reason.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            reason:
              type: string
              description: |
                - `reference_invalid`: `price_reference` is a well-formed price ID
                  that isn't recognized. A malformed ID is a `400`.
                  Re-run discovery and retry with a fresh reference.
                - `currency_not_supported`: the listing can't be bought in the
                  currency this cart would use, e.g. because your account only
                  purchases in its default currency and the listing is priced
                  in another one.
