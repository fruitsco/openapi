  /v1/orders/purchases:
    post:
      operationId: PurchaseCreate
      summary: Create a purchase
      description: |
        Purchase a buy-now-listed domain in a single, atomic call, given a
        cart (`POST /v1/carts`). Creates the order through the same
        entrypoint the browser checkout flow uses.

        A quote is optional. With a locked, unexpired quote (`price_lock`),
        the item is bought at the locked price, even if the listing's price
        has changed meanwhile. Without one, the item is bought at the price
        it was added to the cart at; if the listing's price has changed
        since, the purchase fails with `price_changed` — create a new cart
        and retry.

        A cart becomes at most one purchase: purchasing the same `cart_id`
        again returns the purchase it became instead of buying again. Retry
        with the same `cart_id` and `payment_terms` after a timeout or a
        `503`, never with a new cart.

        If a `503` says the payment couldn't be confirmed, retry with the
        same `Idempotency-Key` and body: the purchase resumes and confirms
        its payment. A new key with the same `cart_id` returns the same
        purchase.

        `payment_terms` decides whether the purchase is fulfilled once paid
        (`prepaid`, the default) or without waiting for the payment
        (`postpaid`, for integration resellers, within their credit limit).
      tags:
        - purchases
      security:
        - oauth2:
            - purchase.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        $ref: '#/components/requestBodies/PurchaseCreate'
      responses:
        '201':
          $ref: '#/components/responses/PurchaseCreate'
        '400':
          description: |
            Error Response. The request is malformed, or the
            `Idempotency-Key` is not 1 to 255 characters long or is sent
            twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Purchasing via the API, or buying `postpaid`, isn't available to
            your account: it's open to integration resellers only.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/PurchaseErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: |
            Unprocessable Entity. The request is invalid, or the
            `Idempotency-Key` was already used for a different request
            (`idempotency_key_reused`). An error with that code has no
            `fields`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: |
            The purchase was created, but its payment couldn't be confirmed.
            This response is not stored, except after 10 attempts, when it
            is stored and replayed with `Idempotent-Replayed: true`. The
            response of the 10th attempt already carries
            `Idempotent-Replayed: true` and is final: don't retry it with
            the same key. Without that header, retry with the same
            `Idempotency-Key` and body after the `Retry-After` header: the
            purchase resumes and confirms its payment. A new key with the
            same `cart_id` returns the same purchase. Don't create a new
            cart — that would create a second purchase.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orders/purchases/{idOrNumber}:
    get:
      operationId: PurchaseGet
      summary: Get purchase
      description: Get the details of a purchase.
      tags:
        - purchases
      security:
        - oauth2:
            - purchase.read
      parameters:
        - name: idOrNumber
          description: The ID or order number of the purchase to retrieve
