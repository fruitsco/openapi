openapi: 3.1.1
info:
  title: fruits API
  description: |
    Public API for fruits. Merchants manage their domain portfolio, sales,
    negotiations, and the fulfillment of what they've sold. Buyers buy
    domains and transfer them to their own registrar.

    ### IDs are opaque strings

    The IDs of resources (an `id`, or a field that references another
    resource, such as `order_id` or `listing_id`) are strings with no
    guaranteed format, length, or character set. Today they are UUIDs, but
    that's an implementation detail, not a contract. Don't parse,
    validate, or store them as strict UUIDs (a regex, a UUID-typed
    database column, a UUID parser call): compare them for equality and
    pass them back verbatim. Other fields that happen to end in `_id`
    (such as `business_vat_id`) are not resource IDs and are unaffected.

    The API accepts either UUIDs or TypeIDs as input. Responses use the
    format of the OAuth client (`id_format`). New OAuth clients use
    TypeIDs; existing ones keep UUIDs until migrated, which can't be
    undone, so test with a new client first.

    ### Request size

    A request body can be at most 2 MiB. A larger body is refused with
    `413 Payload Too Large` and an error response. An operation with a higher
    limit states it in its description. A request with an `Idempotency-Key`
    can have at most 1 MiB, see _Idempotent requests_.

    ### Idempotent requests

    Send an `Idempotency-Key` header to make a retry safe. If a request
    times out or fails, send it again with the same key. The API returns
    the stored response and does not run the request a second time.

    The key is optional on every `POST`, `PUT`, `PATCH` and `DELETE`. We
    strongly recommend it for every call you retry, above all for
    `POST /v1/carts`, `POST /v1/orders/purchases` and
    `POST /v1/transfers`: a retry without a key may repeat the request.
    Use a random UUID v4. A key that is not 1 to 255 characters long, or
    that is sent twice, is rejected with `400`. On any operation, a request
    with a key and a body over 1 MiB is rejected with `413`.

    - **Scope.** A key is scoped to the authenticated account, the acting
      account (`x-account-id`) and the key itself. It is kept for 24 hours.
    - **Same request.** Same method, path and body, byte for byte. A retry
      returns the stored response, errors included: the same status and
      body, with the header `Idempotent-Replayed: true`. A response is
      stored when the request finishes. A request that did nothing, such
      as one the endpoint rejects with a `4xx` before any work, or one
      that fails with a transient `5xx` before any work was committed,
      does not use up the key: fix the request and retry with the same
      key. See _Retryable errors_.
    - **Different request.** The same key with a different request,
      including on another endpoint, is rejected with `422` and the error
      code `idempotency_key_reused`.
    - **Still running.** The same key while the first request is running
      is rejected with `409` and the error code `idempotency_key_in_use`,
      with a `Retry-After` header. This response is not stored. Retry with
      the same key.
    - **Rejected before it runs.** A request rejected before it runs, such
      as one with a missing or insufficient scope (`403`), invalid
      parameters or an invalid body, does not use up the key. A `403` for
      a missing scope never returns a stored response. This includes any
      `4xx` the endpoint answers before it has done any work, such as a
      cart or purchase error with a `reason`, or a `404`. Fix the request,
      or retry it, with the same key. After part of the work is committed,
      a `4xx` is stored and replayed.
    - **Retryable errors.** Check `Idempotent-Replayed` on every `5xx`.
      Without it, retry with the same key and body, after the
      `Retry-After` header if there is one. If the request had done part
      of its work, it resumes; otherwise it starts again. With
      `Idempotent-Replayed: true` the response is final: stop retrying
      that key and use a new one. A `5xx` can be stored the first time you
      see it, so a retry may return it with `Idempotent-Replayed: true`.
      After 10 attempts the `5xx` is stored and returned with that header
      as well. A `503` for a request that another attempt took over has
      `Retry-After: 1` and is not stored. Any operation with a key can
      answer it.
    - **Changing the request.** To change a request whose response is
      stored, use a new key.

    If `POST /v1/orders/purchases` fails with `503`, the order was
    created, but its payment couldn't be confirmed. The response has a
    `Retry-After` header and is not stored. Retry with the same key and
    body: the request resumes and confirms the payment. A new key with
    the same `cart_id` is also safe: the cart returns the same order.
  termsOfService: https://fruits.co/terms
  contact:
    name: fruits API Support
    url: https://fruits.co/contact
    email: dev@fruits.co
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.fruits.co
tags:
  - name: domains
    description: Manage your domain portfolio — list, update, and remove domains, and check their verification status.
    x-displayName: Domains
  - name: negotiations
    description: View incoming offers on your negotiable domains, reply to buyers, and accept, decline, or cancel a negotiation.
    x-displayName: Negotiations
  - name: sales
    description: View your sales and their payments.
    x-displayName: Sales
  - name: fulfillments
    description: Deliver what you've sold — e.g. hand a sold domain over by submitting its auth code — and track each item's delivery.
    x-displayName: Fulfillments
  - name: vouchers
    description: Create and manage discount codes and campaigns on your domains.
    x-displayName: Vouchers
  - name: listings
    description: Search fruits' marketplace inventory and retrieve individual listings.
    x-displayName: Listings
  - name: carts
    description: Create and manage a cart through the API, without a buyer's browser checkout session, so any API-authenticated buyer can build up an order programmatically.
    x-displayName: Carts
  - name: purchases
    description: Buy a domain in a single, atomic call once its cart has a locked price, and retrieve the resulting order.
    x-displayName: Purchases
  - name: transfers
    description: Move a domain to your own registrar — one you've purchased, or one you're reclaiming after a lease ended — and track it until it arrives.
    x-displayName: Transfers
  - name: accounts
    description: Create and manage the accounts you sell on behalf of.
    x-displayName: Accounts
  - name: webhooks
    description: Register and manage endpoints to receive notifications about your account's sales, purchases, transfers, fulfillments, and negotiations as they happen.
    x-displayName: Webhooks
  - name: events
    description: |
      Reference for the webhook event payloads your registered endpoints receive.

      The `data` of a `transfer.*` event is a `Transfer`, which has no `code`: no event carries a transfer's code. When `transfer.ready` arrives, call `GET /v1/transfers/{id}` to read it.
    x-displayName: Events
  - name: parking
    description: View parking (traffic monetization) status and statistics for domains in your portfolio.
    x-displayName: Parking
paths:
  /v1/domains:
    get:
      operationId: DomainList
      summary: List domains
      description: List all domains in your portfolio, with optional filters and pagination.
      tags:
        - domains
      security:
        - oauth2:
            - domain.read
      parameters:
        - name: name
          description: Filter domains by name
          in: query
          schema:
            type: string
          x-oapi-codegen-extra-tags:
            form: name
            binding: omitempty
        - name: archived
          description: Filter domains by archived state
          in: query
          schema:
            type: boolean
          x-oapi-codegen-extra-tags:
            form: archived
            binding: omitempty
        - name: currency
          description: Filter domains by currency
          in: query
          schema:
            $ref: '#/components/schemas/Currency'
          x-oapi-codegen-extra-tags:
            form: currency
            binding: omitempty,oneof=eur usd gbp chf bgn czk dkk huf pln ron sek nok jpy cad aud sgd hkd
        - name: sort
          description: The name of the field to sort the domains by
          in: query
          schema:
            $ref: '#/components/schemas/DomainSort'
        - name: length_min
          description: Filter domains by minimum length
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
          x-oapi-codegen-extra-tags:
            form: length_min
            binding: omitempty,min=1
        - name: length_max
          description: Filter domains by maximum length
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
          x-oapi-codegen-extra-tags:
            form: length_max
            binding: omitempty,min=1
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationOffset'
        - name: price_min
          description: Filter domains by minimum price
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
          x-oapi-codegen-extra-tags:
            form: price_min
            binding: omitempty,min=0
        - name: price_max
          description: Filter domains by maximum price
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
          x-oapi-codegen-extra-tags:
            form: price_max
            binding: omitempty,min=0
        - name: state
          description: Filter domains by state
          in: query
          schema:
            $ref: '#/components/schemas/DomainState'
          x-oapi-codegen-extra-tags:
            form: state
            binding: omitempty,oneof=pending verifying verified unverified
        - name: tld
          description: Filter domains by TLD
          in: query
          schema:
            type: string
          x-oapi-codegen-extra-tags:
            form: tld
            binding: omitempty
        - name: parking
          description: Filter domains by parking enabled state
          in: query
          schema:
            type: boolean
          x-oapi-codegen-extra-tags:
            form: parking
            binding: omitempty
      responses:
        '200':
          $ref: '#/components/responses/DomainList'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /v1/domains/bulk:
    patch:
      operationId: DomainUpdateBulk
      summary: Update domains
      description: Update a list of domains through a filter.
      tags:
        - domains
      security:
        - oauth2:
            - domain.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        $ref: '#/components/requestBodies/DomainUpdateBulk'
      responses:
        '202':
          description: Update accepted
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
    delete:
      operationId: DomainDeleteBulk
      summary: Delete domains
      description: |
        Delete a list of domains through a filter.

        **WARNING**: This is a destructive operation. If a filter is used that matches multiple domains, all of them will be deleted.
      tags:
        - domains
      security:
        - oauth2:
            - domain.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        $ref: '#/components/requestBodies/DomainDeleteBulk'
      responses:
        '202':
          description: Deletion accepted
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/domains/{idOrName}:
    get:
      operationId: DomainGet
      summary: Get domain
      description: Get the details of a domain.
      tags:
        - domains
      security:
        - oauth2:
            - domain.read
      parameters:
        - name: idOrName
          description: The ID or name of the domain to retrieve
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DomainGet'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      operationId: DomainDelete
      summary: Delete domain
      description: |
        Delete a domain from your portfolio.

        **WARNING**: This operation is destructive and cannot be undone.
      tags:
        - domains
      security:
        - oauth2:
            - domain.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: idOrName
          description: The ID or name of the domain to delete
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Domain deleted
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/domains/{idOrName}/authcodes:
    post:
      operationId: DomainAuthCodeCreate
      summary: Create domain auth code
      description: |
        Create a new domain auth code for a domain.

        **Deprecated**: use `POST /v1/fulfillments/{id}/submit` instead. A
        fulfillment is scoped to the specific sale and item the code belongs
        to, rather than requiring `order_id` in the body, and tells you
        whether the code worked.
      deprecated: true
      tags:
        - domains
      security:
        - oauth2:
            - domain.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: idOrName
          description: The ID or name of the domain to create an auth code for
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/DomainAuthCodeCreate'
      responses:
        '201':
          description: Domain auth code created
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/domains/{idOrName}/parking:
    get:
      operationId: DomainParkingGet
      summary: Get domain parking information
      description: Get parking information for a specific domain.
      tags:
        - parking
      security:
        - oauth2:
            - domain.read
      parameters:
        - name: idOrName
          description: The ID or name of the domain to retrieve parking information for
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DomainParkingGet'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /v1/domains/{idOrName}/parking/stats:
    get:
      operationId: DomainParkingStatsGet
      summary: Get domain parking statistics
      description: Get parking statistics for a specific domain. Dates are interpreted in UTC.
      tags:
        - parking
      security:
        - oauth2:
            - domain.read
      parameters:
        - name: idOrName
          description: The ID or name of the domain to retrieve parking statistics for
          in: path
          required: true
          schema:
            type: string
        - name: range
          description: The date range for the statistics. Cannot be used with `start` or `end`.
          in: query
          schema:
            type: string
            enum:
              - today
              - yesterday
              - last_7d
              - last_30d
              - this_month
              - last_month
              - this_year
              - all_time
          x-oapi-codegen-extra-tags:
            form: range
            binding: omitempty,excluded_with=Start,excluded_with=End
        - name: start
          description: Start date for the custom date range (YYYY-MM-DD). Cannot be used with `range`.
          in: query
          schema:
            type: string
            format: date
          x-oapi-codegen-extra-tags:
            form: start
            binding: omitempty,excluded_with=Range,required_with=End
        - name: end
          description: End date for the custom date range (YYYY-MM-DD). Cannot be used with `range`.
          in: query
          schema:
            type: string
            format: date
          x-oapi-codegen-extra-tags:
            form: end
            binding: omitempty,excluded_with=Range,required_with=Start
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationOffset'
      responses:
        '200':
          $ref: '#/components/responses/DomainParkingStatsGet'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /v1/imports:
    post:
      operationId: DomainImportCreate
      summary: Create domain import
      description: |
        Create a new domain import to add, update, or delete domains in your portfolio.

        **WARNING**: Depending on the `mode` selected, this operation can be destructive. 
        In `add_update_delete` mode, any domains in your portfolio that are NOT present in the import source will be **DELETED**.

        The request body can be at most 32 MiB, or 1 MiB when the request has an `Idempotency-Key`.
      tags:
        - domains
      security:
        - oauth2:
            - domain.write
      x-max-request-body-bytes: 33554432
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        $ref: '#/components/requestBodies/DomainImportCreate'
      responses:
        '201':
          $ref: '#/components/responses/DomainImportCreate'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/imports/{id}:
    get:
      operationId: DomainImportGet
      summary: Get domain import
      description: Get the details of a domain import.
      tags:
        - domains
      security:
        - oauth2:
            - domain.read
      parameters:
        - name: id
          description: The ID of the domain import to retrieve
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DomainImportGet'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /v1/negotiations:
    get:
      operationId: NegotiationList
      summary: List negotiations
      description: List all negotiations in your account.
      tags:
        - negotiations
      security:
        - oauth2:
            - negotiation.read
      parameters:
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationOffset'
        - name: query
          description: Filter negotiations by query
          in: query
          schema:
            type: string
          x-oapi-codegen-extra-tags:
            form: query
        - name: status
          description: Filter negotiations by status
          in: query
          schema:
            $ref: '#/components/schemas/NegotiationFilterStatus'
          x-oapi-codegen-extra-tags:
            form: status
            binding: omitempty,oneof=active sold cancelled
        - name: sort
          description: The name of the field to sort the negotiations by
          in: query
          schema:
            $ref: '#/components/schemas/NegotiationSort'
      responses:
        '200':
          $ref: '#/components/responses/NegotiationList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /v1/negotiations/{id}:
    get:
      operationId: NegotiationGet
      summary: Get negotiation
      description: Get the details of a negotiation.
      tags:
        - negotiations
      security:
        - oauth2:
            - negotiation.read
      parameters:
        - name: id
          description: The ID of the negotiation to retrieve
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/NegotiationGetResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/negotiations/{id}/messages:
    get:
      operationId: NegotiationMessages
      summary: List negotiation messages
      description: List all messages of a negotiation.
      tags:
        - negotiations
      security:
        - oauth2:
            - negotiation.read
      parameters:
        - name: id
          description: The ID of the negotiation to retrieve messages for
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/NegotiationMessagesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /v1/negotiations/{id}/messages/reply:
    post:
      operationId: ReplyNegotiation
      summary: Reply to a negotiation
      description: Reply to a negotiation.
      tags:
        - negotiations
      security:
        - oauth2:
            - negotiation.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: id
          description: The ID of the negotiation to reply to
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/ReplyNegotiation'
      responses:
        '204':
          description: Reply sent
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/negotiations/{id}/receipts/me:
    put:
      summary: Set caller's last-read message pointer
      operationId: NegotiationReadReceiptUpdate
      description: Update the receipt of a negotiation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: id
          description: The ID of the negotiation to update the receipt for
          in: path
          required: true
          schema:
            type: string
      tags:
        - negotiations
      security:
        - oauth2:
            - negotiation.write
      requestBody:
        $ref: '#/components/requestBodies/ReadReceiptUpdate'
      responses:
        '204':
          description: Read receipt updated
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/negotiations/{id}/cancel:
    post:
      operationId: CancelNegotiation
      summary: Cancel a negotiation
      description: Cancel a negotiation.
      tags:
        - negotiations
      security:
        - oauth2:
            - negotiation.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: id
          description: The ID of the negotiation to cancel
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Negotiation cancelled
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
