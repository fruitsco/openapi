    Listing:
      title: Listing
      description: |
        A single thing for sale on fruits, with its current, live
        pricing — the representation of a product available for
        purchase. Returned both as a search result (wrapped in
        `SearchResult`) and standalone via `GET /v1/listings/{id}`.
      allOf:
        - $ref: '#/components/schemas/Article'
        - type: object
          properties:
            currency:
              description: |
                The listing's own currency. `shop_price`, if any, is in
                it, and a listing without a fixed price takes offers in it.
              allOf:
                - $ref: '#/components/schemas/Currency'
            shop_price:
              description: |
                The price the shop set, per unit, in the listing's own
                currency — never converted — and either including or
                excluding tax. Null exactly when `price` is null.
              oneOf:
                - $ref: '#/components/schemas/Price'
                - type: 'null'
            price:
              description: |
                What buying this listing directly costs, in your currency
                (see the search's `currency`), plus a `reference_id` for
                locking it — see `ListingPrice`. Null
                when `options` doesn't include `direct` — there's no
                fixed price to buy at.
              oneOf:
                - $ref: '#/components/schemas/ListingPrice'
                - type: 'null'
            amounts:
              description: |
                The full breakdown behind `price`, in its currency:
                `principal` plus `adjustments` add up to `total`, which
                equals `price.amount`. It is priced as the cart you would
                create for it prices it, before any voucher.

                It has the tax your account's settings say you pay, so it
                depends on who asks. Null when `price` is null, and when your
                account's settings don't tell the tax: it has no country or
                business type, or it is an EU business outside Germany whose
                VAT ID isn't validated, which decides between reverse charge
                and VAT. `price` is then the shop's price, and the amounts
                follow once your account does.
              oneOf:
                - $ref: '#/components/schemas/Amounts'
                - type: 'null'
            options:
              type: array
              items:
                $ref: '#/components/schemas/ListingOption'
          required:
            - currency
            - shop_price
            - price
            - amounts
            - options
    ListingOption:
      type: string
      description: |
        A listing can carry any combination of these at once — they
        describe independent ways to acquire it, not mutually exclusive
        categories. A listing can be `direct` and also accept offers and
        also be lease eligible, all at the same time.

        - `direct`: purchasable at `price` with no negotiation, via
          `POST /v1/orders/purchases`.
        - `offer`: the seller also accepts negotiated offers. Not
          purchasable via the direct purchase API — negotiate first.
        - `lease`: also purchasable via instalments (lease-to-own). Not
          purchasable via the direct purchase API.
      enum:
        - direct
        - offer
        - lease
      x-enum-varnames:
        - LISTING_OPTION_DIRECT
        - LISTING_OPTION_OFFER
        - LISTING_OPTION_LEASE
    ListingPrice:
      title: ListingPrice
      description: |
        What buying this listing directly costs, plus proof that it's the
        listing's price you were shown. Pass `reference_id` as
        `CartItemInput.price_reference` to catch the listing's price having
        changed by the time you act on it. Only that check is independent of
        your account's tax settings: `amount` follows them, and a cart
        prices the tax again when it is created.

        `amount` is priced for your account, with the tax its settings say
        you pay, as a cart of yours prices it. If they don't say (see
        `Listing.amounts`), it is the shop's price, and `tax_behavior` says
        whether that includes tax.
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            reference_id:
              description: |
                The ID of this price, in the ID format of your OAuth client.
                Either spelling is accepted when you pass it back.
              type: string
            tax_behavior:
              description: |
                Whether `amount` includes tax. `inclusive`: it is what you
                pay, with all the tax there is in it. `exclusive`: it is the
                shop's net price, and tax is added on top of it when you buy.
                It is `exclusive` only while `Listing.amounts` is null.
              allOf:
                - $ref: '#/components/schemas/TaxBehavior'
          required:
            - reference_id
            - tax_behavior
    Money:
