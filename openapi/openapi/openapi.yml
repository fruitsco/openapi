          schema:
            type: string
          x-oapi-codegen-extra-tags:
            form: listing_id
            binding: omitempty
        - name: domain
          description: Filter transfers by domain, by its normalized name
          in: query
          schema:
            type: string
          x-oapi-codegen-extra-tags:
            form: domain
            binding: omitempty
        - name: reason
          description: Filter transfers by reason
          in: query
          schema:
            $ref: '#/components/schemas/TransferReason'
          x-oapi-codegen-extra-tags:
            form: reason
            binding: omitempty,oneof=purchase reclaim
        - name: state
          description: Filter transfers by state
          in: query
          schema:
            $ref: '#/components/schemas/TransferState'
          x-oapi-codegen-extra-tags:
            form: state
            binding: omitempty,oneof=requires_destination pending ready completed cancelled
      responses:
        '200':
          $ref: '#/components/responses/TransferList'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    post:
      operationId: TransferCreate
      summary: Create or update a transfer
      description: |
        Say where a domain should go, starting its transfer if it hasn't
        started yet. An item has at most one transfer that isn't
        `completed` or `cancelled`: if it already has one, this updates
        that transfer's `destination` and returns it (`200`); otherwise
        it creates one (`201`).

        Who can transfer an item follows from its order:
        - **Your purchase** (`reason: purchase`), once it's paid — or,
          for a lease-to-own order, once you've bought it out. Create its
          transfer whenever suits you: before the seller has handed the
          domain over, it waits for them (`pending`); after, it delivers
          right away. A `destination` is required for `registrar_release`
          domains, and optional (but still useful) for `auth_code`. A
          purchase made in fruits' checkout already has its transfer once
          the seller has handed the domain over, so you'd only update it.
        - **Your sale** (`reason: reclaim`), once its lease has ended
          without a buyout and fruits holds the domain at its registrar.
          This cancels any open transfer to the buyer, whose code stops
          working. If the domain never left your registrar, there's
          nothing to reclaim (`domain_not_held`).

        `destination` can be set or changed until the transfer is
        `ready`; after that, the code is out or the domain is released,
        and a new `destination` fails with `unexpected_state`. When the
        seller hands the domain straight to your registrar, it's also
        final once they have: it can still be set if you hadn't, but not
        changed. A listing's `entity.domain.transfer_method` tells you
        upfront whether you'll need one.

        Fails with `422` if the item isn't identified by exactly one of
        `listing_id` and `domain`, if `destination` is missing for a
        `registrar_release` domain, or if `destination.registrar.scheme`
        isn't one the domain's TLD supports. Fails with `404` if the order
        has no such item you bought or sold, including a prepaid order
        whose payment hasn't completed: its items aren't delivered yet.
      tags:
        - transfers
      security:
        - oauth2:
            - transfer.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        $ref: '#/components/requestBodies/TransferCreate'
      responses:
        '200':
          $ref: '#/components/responses/TransferUpdate'
        '201':
          $ref: '#/components/responses/TransferCreate'
        '400':
          description: |
            Error Response. The request is malformed, or the
            `Idempotency-Key` is not 1 to 255 characters long or is sent
            twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/TransferErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          description: |
            Unprocessable Entity. The request is invalid, or the
            `Idempotency-Key` was already used for a different request
            (`idempotency_key_reused`). An error with that code has no
            `fields`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/transfers/{id}:
    get:
      operationId: TransferGet
      summary: Get transfer
      description: |
        Get the details of a transfer.

        Returns a `TransferWithCode`. This is the only operation that
        returns the transfer's `code`: webhook events, lists and the
        operations that create or change a transfer never carry it. When
        `transfer.ready` arrives, call this to get the code.
      tags:
        - transfers
      security:
        - oauth2:
            - transfer.read
      parameters:
        - name: id
          description: The ID of the transfer to retrieve
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/TransferGet'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/transfers/{id}/retry:
    post:
      operationId: TransferRetry
      summary: Retry a transfer
      description: |
        Report that the transfer's `code` didn't work, and get a new one.
        Only for `auth_code` transfers that are `ready`. The transfer goes
        back to `pending` until a new code is available — the seller may
        have to provide it — and `code` is replaced. Read the new one with
        `GET /v1/transfers/{id}` once the transfer is `ready` again.
      tags:
        - transfers
      security:
        - oauth2:
            - transfer.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: id
          description: The ID of the transfer to retry
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/TransferRetry'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/TransferErrorResponse'
        '422':
          $ref: '#/components/responses/IdempotencyValidationErrorResponse'
        '503':
          $ref: '#/components/responses/IdempotencyRetryResponse'
  /v1/transfers/{id}/confirm:
    post:
      operationId: TransferConfirm
      summary: Confirm a transfer
      description: |
        Confirm that the domain has arrived at your registrar. Only for
        transfers that are `ready`; the transfer becomes `completed`.
