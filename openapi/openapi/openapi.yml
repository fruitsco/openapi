components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth2 authorization code and client credentials flow.

        Every scope is `<resource>.read` or `<resource>.write`, and a
        `write` scope includes the matching `read` scope.
      flows:
        clientCredentials:
          tokenUrl: https://api.fruits.co/oauth2/token
          scopes:
