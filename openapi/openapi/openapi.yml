    Transfer:
      type: object
      title: Transfer
      description: |
        A domain moving from fruits to your registrar — because you
        bought it (`reason: purchase`), or because it's yours again after
        a lease ended (`reason: reclaim`).

        For a purchase you made through the API, you create its transfer
        with `POST /v1/transfers` once the domain is yours to transfer
        (once its order is paid, or, for a lease-to-own order, bought
        out). The seller hands the domain over through their own
        `Fulfillment`, which you don't see; until they have, your
        transfer is `pending`, and once they have, it delivers right
        away. For a `registrar_release` domain, the seller can only do so
        once you've said where it goes (`requires_destination`).

        A purchase made in fruits' checkout gets its transfer from fruits,
        once the seller has handed the domain over.

        A `Transfer` has no `code`. It's what a list, a `transfer.*` event
        and the operations that create or change a transfer carry.
        `GET /v1/transfers/{id}` returns a `TransferWithCode`, which is a
        `Transfer` plus its `code`.
      properties:
        id:
          type: string
        order_id:
          description: The order this domain moves under.
          type: string
        listing_id:
          description: The listing this domain was sold as. Together with `order_id`, it identifies the item on the order.
          type: string
        domain:
          description: The normalized name of the domain being transferred.
          type: string
        reason:
          $ref: '#/components/schemas/TransferReason'
        state:
          $ref: '#/components/schemas/TransferState'
        method:
          description: How this domain moves. Decided by fruits per TLD — see `TransferMethod`.
          $ref: '#/components/schemas/TransferMethod'
        destination:
          description: |
            Where you asked the domain to go, if you said. Set or change
            it with `POST /v1/transfers` until the transfer is `ready`.
            See `TransferDestination`.
          oneOf:
            - $ref: '#/components/schemas/TransferDestination'
            - type: 'null'
        code_expires_at:
          description: When `code` stops working, if its registrar says so.
          type:
            - string
            - 'null'
          format: date-time
        cancellation_reason:
          oneOf:
            - $ref: '#/components/schemas/TransferCancellationReason'
            - type: 'null'
        ready_at:
          description: When the transfer last became `ready`.
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        object:
          type: string
          enum:
            - transfer
      required:
        - id
        - order_id
        - listing_id
        - domain
        - reason
        - state
        - method
        - destination
        - code_expires_at
        - cancellation_reason
        - ready_at
        - completed_at
        - cancelled_at
        - created_at
        - updated_at
        - object
