        - type: object
          properties:
            reason:
              type: string
              enum:
                - price_changed
              x-enum-varnames:
                - CART_ERROR_REASON_PRICE_CHANGED
            current_price:
              description: The item's current price. Equal to `current_amounts.total`.
              $ref: '#/components/schemas/Money'
            current_amounts:
              description: The item's current price breakdown.
              $ref: '#/components/schemas/Amounts'
          required:
            - reason
            - current_price
            - current_amounts
    CartItem:
      type: object
      title: CartItem
      description: |
        An item in a cart. `listing` identifies what's in the cart — it
        never carries live pricing (see `Article`). `price`/`amounts` are
        the resolved price for this item: the locked value from `quote`
        once one exists and hasn't expired, otherwise computed from
        `shop_price`, the price the item was added at.

        An unquoted item stays pinned to its `shop_price`, whether that's
        the listing's price or an accepted offer (see `price_source`):
        `price`/`amounts` keep showing it even after the listing's price
        changes, and a purchase fails with `price_changed` once what the
        item would be bought at now differs from it. Lock the price with
        `price_lock` to avoid this.
      properties:
        id:
          type: string
        listing:
          $ref: '#/components/schemas/Article'
        quantity:
          type: integer
          format: int32
        shop_price:
          description: |
            The price the item was added at, as the shop set or accepted
            it: per unit, in the listing's currency, and either including
            or excluding tax. `price_source` says which it is.
          $ref: '#/components/schemas/Price'
        price_source:
          $ref: '#/components/schemas/PriceSource'
        unit_price:
          description: |
            The price of one unit, in the cart's currency, before
            discounts, with tax as in `amounts.total`. `price` is
            `unit_price` × `quantity`, less discounts, plus fees.
          $ref: '#/components/schemas/Money'
        price:
          description: |
            What the item costs, in the cart's currency. Equal to
            `amounts.total`.
          $ref: '#/components/schemas/Money'
        amounts:
          description: The full breakdown behind `price`, in its currency.
          $ref: '#/components/schemas/Amounts'
        quote:
          oneOf:
            - $ref: '#/components/schemas/Quote'
            - type: 'null'
      required:
        - id
        - listing
        - quantity
        - shop_price
        - price_source
        - unit_price
        - price
        - amounts
    CartItemInput:
      type: object
      properties:
        listing:
          description: |
            The listing to add to the cart — its `id` (see
            `GET /v1/search`), or, for a domain, its normalized name
            (`entity.domain.name` on the listing, not its display `name`,
