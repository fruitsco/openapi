        - metadata
    AccountCreate:
      type: object
      title: AccountCreate
      description: 'A light account to create. It needs no input of its own: it takes its identity from you, and you collect its funds.'
      properties:
        dashboard:
          $ref: '#/components/schemas/AccountCreateDashboard'
        metadata:
          type: object
          description: Key/value pairs you set on the account, e.g. your own customer ID. Up to 50 keys; keys up to 40 characters, values up to 500. Set a key to an empty string to remove it.
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            minLength: 1
            maxLength: 40
          maxProperties: 50
      additionalProperties: false
    AccountCreateDashboard:
      type: string
      description: Dashboard access of the light account to create. Defaults to light.
      enum:
        - light
        - none
      x-enum-varnames:
        - ACCOUNT_CREATE_DASHBOARD_LIGHT
        - ACCOUNT_CREATE_DASHBOARD_NONE
    AccountDashboard:
      type: string
      description: 'Dashboard access of the account. standard accounts: full. light accounts: light (default) or none.'
      enum:
        - full
        - light
        - none
      x-enum-varnames:
        - ACCOUNT_DASHBOARD_FULL
        - ACCOUNT_DASHBOARD_LIGHT
        - ACCOUNT_DASHBOARD_NONE
    AccountType:
      type: string
      description: standard accounts have their own identity and payment account light accounts take their identity from you and you collect their funds.
      enum:
        - standard
        - light
      x-enum-varnames:
        - ACCOUNT_TYPE_STANDARD
        - ACCOUNT_TYPE_LIGHT
    Adjustment:
      description: |
        A single named charge or reduction contributing to an
        `Amounts`'s `total`. `amount` is its resolved effect on the
        running total — negative for `discount` and `platform_commission`
        (both reduce it: a discount lowers what the buyer pays, a
        commission lowers what the seller is paid), positive for
        `platform_fee`, `fx_markup`, `lease_markup`, and `tax`, and either
        sign for `rounding`, whichever direction corrects the residual.
        `rate`, where present, is the rate `amount` was computed from.

        - `discount`: a reduction applied before fees and tax.
        - `platform_fee`: the platform's own handling/service charge,
          added to what the buyer pays.
        - `platform_commission`: the platform's commission on a sale,
          deducted from what the seller receives.
        - `fx_markup`: a currency-conversion spread charged to the buyer,
          on top of the underlying rate.
        - `lease_markup`: the premium built into instalment (lease-to-own)
          pricing, on top of the underlying listing price.
        - `tax`: tax added on top of everything listed before it.
        - `rounding`: the correction needed to round a value to the
          currency's next valid minor unit. Seller-side only — rounding
          remainders accumulate across a period and are settled as a
          lump sum on `Earning`, never on a buyer-facing `Amounts`.

        Other types may be added later as new pricing mechanisms are
        introduced.
      oneOf:
        - $ref: '#/components/schemas/AdjustmentDiscount'
        - $ref: '#/components/schemas/AdjustmentPlatformFee'
        - $ref: '#/components/schemas/AdjustmentPlatformCommission'
        - $ref: '#/components/schemas/AdjustmentFxMarkup'
        - $ref: '#/components/schemas/AdjustmentLeaseMarkup'
        - $ref: '#/components/schemas/AdjustmentTax'
        - $ref: '#/components/schemas/AdjustmentRounding'
      discriminator:
        propertyName: type
        mapping:
          discount: '#/components/schemas/AdjustmentDiscount'
          platform_fee: '#/components/schemas/AdjustmentPlatformFee'
          platform_commission: '#/components/schemas/AdjustmentPlatformCommission'
          fx_markup: '#/components/schemas/AdjustmentFxMarkup'
          lease_markup: '#/components/schemas/AdjustmentLeaseMarkup'
          tax: '#/components/schemas/AdjustmentTax'
          rounding: '#/components/schemas/AdjustmentRounding'
    AdjustmentDiscount:
      type: object
      title: AdjustmentDiscount
      description: A reduction applied before fees and tax.
      properties:
        type:
          type: string
          enum:
            - discount
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          type:
            - number
            - 'null'
          format: double
      required:
        - type
        - amount
    AdjustmentFxMarkup:
      type: object
      title: AdjustmentFxMarkup
      description: A currency-conversion spread charged to the buyer, on top of the underlying rate.
      properties:
        type:
          type: string
          enum:
            - fx_markup
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          type:
            - number
            - 'null'
          format: double
      required:
        - type
        - amount
    AdjustmentLeaseMarkup:
      type: object
      title: AdjustmentLeaseMarkup
      description: The premium built into instalment (lease-to-own) pricing, on top of the underlying listing price.
      properties:
        type:
          type: string
          enum:
            - lease_markup
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          type:
            - number
            - 'null'
          format: double
      required:
        - type
        - amount
    AdjustmentPlatformCommission:
      type: object
      title: AdjustmentPlatformCommission
      description: The platform's commission on a sale, deducted from what the seller receives.
      properties:
        type:
          type: string
          enum:
            - platform_commission
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          type:
            - number
            - 'null'
          format: double
      required:
        - type
        - amount
    AdjustmentPlatformFee:
      type: object
      title: AdjustmentPlatformFee
      description: The platform's own handling/service charge, added to what the buyer pays.
      properties:
        type:
          type: string
          enum:
            - platform_fee
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          type:
            - number
            - 'null'
          format: double
      required:
        - type
        - amount
    AdjustmentRounding:
      type: object
      title: AdjustmentRounding
      description: |
        The correction needed to round a value to the currency's next
        valid minor unit. Seller-side only — rounding remainders
        accumulate across a period and are settled as a lump sum on
        `Earning`, never on a buyer-facing `Amounts`.
      properties:
        type:
          type: string
          enum:
            - rounding
        amount:
          $ref: '#/components/schemas/Money'
      required:
        - type
        - amount
    AdjustmentTax:
      type: object
      title: AdjustmentTax
      description: Tax added on top of everything listed before it.
      properties:
        type:
          type: string
          enum:
            - tax
        amount:
          $ref: '#/components/schemas/Money'
        rate:
          type: number
          format: double
        reverse_charge:
          type: boolean
      required:
        - type
        - amount
        - rate
        - reverse_charge
    Amounts:
      type: object
      title: Amounts
      description: |
        A price built from a `principal` amount plus zero or more ordered
        `adjustments`, arriving at `total`. Each adjustment applies
        against the running total as of its position in the array — a
        `tax` adjustment, for instance, is computed on everything listed
        before it, not on `principal` alone or on the final `total`.

        `total` always exactly equals `principal` plus the sum of
        `adjustments[].amount` — any residual difference from rounding
        intermediate amounts independently is captured explicitly as its
        own `rounding` adjustment, rather than left unaccounted for.

        `principal` is tax-exclusive, consistently everywhere `Amounts`
        is used — sales, payments, earnings, and carts alike. VAT is
        always represented explicitly as a `tax` adjustment, never
        folded into `principal` itself; `total` is tax-inclusive wherever
        a `tax` adjustment is present (and may legitimately not be, e.g.
        under reverse charge — see `AdjustmentTax.reverse_charge`).
      properties:
        principal:
          description: The tax-exclusive starting amount `adjustments` apply to.
          $ref: '#/components/schemas/Money'
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/Adjustment'
        total:
          $ref: '#/components/schemas/Money'
        base:
          deprecated: true
          description: |
            Deprecated — superseded by `principal`, which is NOT the
            same value. `base` is tax-inclusive: the gross, VAT-inclusive
            starting price, before any discounts or fees — its original,
            pre-`adjustments` meaning, preserved as-is for compatibility.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        subtotal:
          deprecated: true
          description: Deprecated — superseded by `adjustments`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        subtotal_net:
          deprecated: true
          description: Deprecated — superseded by `adjustments`.
          oneOf:
            - $ref: '#/components/schemas/Money'
