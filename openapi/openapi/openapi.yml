          required:
            - reason
    CartErrorPriceChanged:
      title: CartErrorPriceChanged
      description: |
        The item's live-resolved price no longer matches what
        `price_reference` was issued for. `current_price` and
        `current_amounts` carry the new price, so you don't need a second
        round trip to see it.
      allOf:
